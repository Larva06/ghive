name: Execute ghive

on:
  workflow_dispatch:
  schedule:
    # run every hour
    - cron: "0 * * * *"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  execute:
    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # for checkout

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@6d1e696aa24c1aa1bcc1adea0212707c71ab78a8 # v3.6.1
        with:
          version: 2025.12.13
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Execute ghive
        run: mise run execute
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          USER_EMAILS_ALLOW_LIST: ${{ secrets.USER_EMAILS_ALLOW_LIST }}
          ROOT_FOLDERS_ALLOW_LIST: ${{ secrets.ROOT_FOLDERS_ALLOW_LIST }}

  actions-timeline:
    needs:
      - execute
    if: ${{ !cancelled() }}

    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read

    steps:
      - name: actions-timeline
        uses: Kesin11/actions-timeline@7c7e0821d38f27460f4a71ef874a1c8cf23602e4 # v2.2.6

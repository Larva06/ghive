name: Execute ghive

on:
  workflow_dispatch:
  schedule:
    # run every hour
    - cron: "0 * * * *"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  execute:
    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # for checkout

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: 2025.8.7
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Execute ghive
        run: mise run execute
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          USER_EMAILS_ALLOW_LIST: ${{ secrets.USER_EMAILS_ALLOW_LIST }}
          ROOT_FOLDERS_ALLOW_LIST: ${{ secrets.ROOT_FOLDERS_ALLOW_LIST }}

  actions-timeline:
    needs:
      - execute
    if: ${{ !cancelled() }}

    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read

    steps:
      - name: actions-timeline
        uses: Kesin11/actions-timeline@a7eaabf426cdae26c3582c3fa674b897170dec8f # v2.2.4

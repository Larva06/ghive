# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

[tools]
bun = "1.2.13"
node = "24.0.2"
biome = "1.9.4"
# required for actionlint
shellcheck = "0.10.0"
actionlint = "1.7.7"
ghalint = "1.4.0"
pinact = "3.1.1"
taplo = "0.9.3"
yamlfmt = "0.16.0"
# required for pipx backend
uv = "0.7.5"
yamllint = "1.37.1"
typos = "1.32.0"
"npm:ignore-sync" = "8.0.0"
"npm:jschema-validator" = "1.0.15"

[settings]
experimental = true

[settings.npm]
bun = true

[task_config]
includes = ["tasks.toml", "tasks"]

[hooks]
postinstall = """
{% if env.CI is undefined %}
  mise run buni
{% endif %}
"""

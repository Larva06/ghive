# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

[tools]
bun = "1.2.15"
node = "24.1.0"
biome = "1.9.4"
# required for actionlint
shellcheck = "0.10.0"
actionlint = "1.7.7"
ghalint = "1.4.1"
pinact = "3.1.2"
taplo = "0.10.0"
yamlfmt = "0.17.0"
# required for pipx backend
uv = "0.7.10"
yamllint = "1.37.1"
typos = "1.33.1"
"npm:ignore-sync" = "8.0.0"
"npm:jschema-validator" = "1.0.16"

[settings]
experimental = true

[settings.npm]
bun = true

[task_config]
includes = ["tasks.toml", "tasks"]

[hooks]
postinstall = """
{% if env.CI is undefined %}
  mise run buni
{% endif %}
"""

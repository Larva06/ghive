name: Execute ghive

on:
  workflow_dispatch:
  schedule:
    # run every hour
    - cron: "0 * * * *"

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  execute:
    environment: production

    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # for checkout

    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@9dc7d5dd454262207dea3ab5a06a3df6afc8ff26 # v3.4.1
        with:
          version: 2025.11.5
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Execute ghive
        run: mise run execute
        env:
          GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
          GOOGLE_SERVICE_ACCOUNT_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          USER_EMAILS_ALLOW_LIST: ${{ secrets.USER_EMAILS_ALLOW_LIST }}
          ROOT_FOLDERS_ALLOW_LIST: ${{ secrets.ROOT_FOLDERS_ALLOW_LIST }}

  actions-timeline:
    needs:
      - execute
    if: ${{ !cancelled() }}

    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read

    steps:
      - name: actions-timeline
        uses: Kesin11/actions-timeline@54d513e0b5ff1158f1cf8321108d666a5a6c1fca # v2.2.5

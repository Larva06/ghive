# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

[tools]
bun = "1.2.19"
node = "24.5.0"
biome = "2.1.4"
# required for actionlint
shellcheck = "0.11.0"
actionlint = "1.7.7"
ghalint = "1.5.3"
pinact = "3.3.2"
taplo = "0.10.0"
yamlfmt = "0.17.2"
# required for pipx backend
uv = "0.8.6"
yamllint = "1.37.1"
typos = "1.35.3"
"npm:ignore-sync" = "8.0.0"
"npm:jschema-validator" = "1.0.19"

[settings]
experimental = true

[settings.npm]
bun = true

[task_config]
includes = ["tasks.toml", "tasks"]

[hooks]
postinstall = """
{% if env.CI is undefined %}
  mise run buni
{% endif %}
"""

# ref: https://mise.jdx.dev/configuration.html
#:schema https://mise.jdx.dev/schema/mise.json

[tools]
bun = "1.3.4"
node = "25.2.1"
biome = "2.2.7"
# required for actionlint
shellcheck = "0.11.0"
actionlint = "1.7.9"
ghalint = "1.5.4"
pinact = "3.5.0"
taplo = "0.10.0"
yamlfmt = "0.20.0"
# required for pipx backend
uv = "0.9.16"
yamllint = "1.37.1"
typos = "1.40.0"
"npm:ignore-sync" = "8.0.0"
"npm:jschema-validator" = "1.0.25"

[settings]
experimental = true

[settings.npm]
bun = true

[task_config]
includes = ["tasks.toml", "tasks"]

[hooks]
postinstall = """
{% if env.CI is undefined %}
  mise run buni
{% endif %}
"""
